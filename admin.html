<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b5e20">
    <title>NODO TROYA | Admin - Gestión de Productos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            color: #1b5e20;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .form-section {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        
        .form-section h2 {
            color: #2e7d32;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: #1b5e20;
            color: white;
        }
        
        .btn-danger {
            background: #c62828;
            color: white;
        }
        
        .btn-secondary {
            background: #757575;
            color: white;
        }
        
        .btn-success {
            background: #2e7d32;
            color: white;
        }
        
        .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .actions .btn {
            flex: 1;
        }
        
        .product-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .product-list h2 {
            padding: 1rem;
            background: #1b5e20;
            color: white;
            font-size: 1rem;
        }
        
        .product-item {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .product-item:last-child {
            border-bottom: none;
        }
        
        .product-info h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 0.2rem;
        }
        
        .product-info p {
            font-size: 0.8rem;
            color: #888;
        }
        
        .product-info .price {
            color: #2e7d32;
            font-weight: 600;
        }
        
        .product-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn-edit {
            background: #1976d2;
            color: white;
        }
        
        .btn-delete {
            background: #d32f2f;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .hidden {
            display: none;
        }
        
        .category-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .cat-alimentos { background: #e8f5e9; color: #2e7d32; }
        .cat-tecnologia { background: #e3f2fd; color: #1976d2; }
        .cat-grafica { background: #fff3e0; color: #ef6c00; }
    </style>
</head>
<body>
    <h1>🌿 Nodo Nueva Troya</h1>
    <p class="subtitle">Gestión de Productos - Admin</p>
    
    <div id="message"></div>
    
    <div class="form-section">
        <h2 id="form-title">📦 Nuevo Producto</h2>
        
        <form id="product-form">
            <input type="hidden" id="product-id">
            
            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" required placeholder="Ej: Jugos Naturales">
            </div>
            
            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="alimentos">🥬 Soberanía Alimentaria</option>
                    <option value="tecnologia">🔧 Hardware Libre</option>
                    <option value="grafica">📢 Comunicación</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="3" placeholder="Descripción del producto..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="precio">Precio</label>
                <input type="text" id="precio" placeholder="Ej: $150, Consultar, Gratis">
            </div>
            
            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" id="stock" min="0" placeholder="Cantidad disponible">
            </div>
            
            <div class="form-group">
                <label for="imagen_url">URL de Imagen</label>
                <input type="url" id="imagen_url" placeholder="https://... o images/archivo.png">
            </div>
            
            <div class="actions">
                <button type="submit" class="btn btn-primary" id="btn-save">💾 Guardar</button>
                <button type="button" class="btn btn-secondary hidden" id="btn-cancel">❌ Cancelar</button>
            </div>
        </form>
    </div>
    
    <div class="product-list">
        <h2>📋 Productos Existentes</h2>
        <div id="products-container">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';
        
        const form = document.getElementById('product-form');
        const formTitle = document.getElementById('form-title');
        const btnSave = document.getElementById('btn-save');
        const btnCancel = document.getElementById('btn-cancel');
        const productsContainer = document.getElementById('products-container');
        const messageDiv = document.getElementById('message');
        
        let editingId = null;
        
        function showMessage(text, type = 'success') {
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => messageDiv.innerHTML = '', 3000);
        }
        
        async function loadProducts() {
            if (!supabase) {
                productsContainer.innerHTML = '<div class="error">Error: Supabase no configurado</div>';
                return;
            }
            
            const { data, error } = await supabase
                .from('productos')
                .select('*')
                .order('id', { ascending: true });
            
            if (error) {
                productsContainer.innerHTML = `<div class="error">Error cargando: ${error.message}</div>`;
                return;
            }
            
            if (!data || data.length === 0) {
                productsContainer.innerHTML = '<div class="loading">No hay productos. Agrega uno nuevo.</div>';
                return;
            }
            
            productsContainer.innerHTML = data.map(p => `
                <div class="product-item">
                    <div class="product-info">
                        <h3>${p.nombre}</h3>
                        <span class="category-badge cat-${p.categoria}">${p.categoria}</span>
                        <p class="price">${p.precio || 'Consultar'}</p>
                        <p>${p.descripcion?.substring(0, 50) || ''}${p.descripcion?.length > 50 ? '...' : ''}</p>
                    </div>
                    <div class="product-actions">
                        <button class="btn-small btn-edit" onclick="editProduct(${p.id})">✏️</button>
                        <button class="btn-small btn-delete" onclick="deleteProduct(${p.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        window.editProduct = async function(id) {
            if (!supabase) return;
            
            const { data, error } = await supabase
                .from('productos')
                .select('*')
                .eq('id', id)
                .single();
            
            if (error || !data) {
                showMessage('Error cargando producto', 'error');
                return;
            }
            
            editingId = id;
            document.getElementById('product-id').value = data.id;
            document.getElementById('nombre').value = data.nombre;
            document.getElementById('categoria').value = data.categoria;
            document.getElementById('descripcion').value = data.descripcion || '';
            document.getElementById('precio').value = data.precio || '';
            document.getElementById('stock').value = data.stock || '';
            document.getElementById('imagen_url').value = data.imagen_url || '';
            
            formTitle.textContent = '✏️ Editar Producto';
            btnSave.textContent = '💾 Actualizar';
            btnCancel.classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        
        window.deleteProduct = async function(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            if (!supabase) return;
            
            const { error } = await supabase
                .from('productos')
                .delete()
                .eq('id', id);
            
            if (error) {
                showMessage('Error eliminando: ' + error.message, 'error');
                return;
            }
            
            showMessage('Producto eliminado');
            loadProducts();
        };
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!supabase) {
                showMessage('Supabase no configurado', 'error');
                return;
            }
            
            const producto = {
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                descripcion: document.getElementById('descripcion').value,
                precio: document.getElementById('precio').value,
                stock: parseInt(document.getElementById('stock').value) || 0,
                imagen_url: document.getElementById('imagen_url').value
            };
            
            if (editingId) {
                const { error } = await supabase
                    .from('productos')
                    .update(producto)
                    .eq('id', editingId);
                
                if (error) {
                    showMessage('Error actualizando: ' + error.message, 'error');
                    return;
                }
                showMessage('Producto actualizado');
            } else {
                const { error } = await supabase
                    .from('productos')
                    .insert([producto]);
                
                if (error) {
                    showMessage('Error guardando: ' + error.message, 'error');
                    return;
                }
                showMessage('Producto creado');
            }
            
            form.reset();
            editingId = null;
            formTitle.textContent = '📦 Nuevo Producto';
            btnSave.textContent = '💾 Guardar';
            btnCancel.classList.add('hidden');
            loadProducts();
        });
        
        btnCancel.addEventListener('click', () => {
            form.reset();
            editingId = null;
            formTitle.textContent = '📦 Nuevo Producto';
            btnSave.textContent = '💾 Guardar';
            btnCancel.classList.add('hidden');
        });
        
        // Cargar productos al iniciar
        loadProducts();
        
        // Actualizar cada 30 segundos
        setInterval(loadProducts, 30000);
    </script>
</body>
</html>
